name: Tests

# Runs on every push, but only when the code or the playbook changes.
on:
  push:
    paths:
      - "agent.py"
      - "scenarios.py"
      - "report.py"
      - "playbook.md"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Version to test with the real AI: agent (tool loop) or planner (plan, check, run, decide)"
        type: choice
        options: [agent, planner]
        default: agent
      reviewer:
        description: "Second AI pass over the draft (extra AI call per scenario)"
        type: choice
        options: ["off", "on"]
        default: "off"

permissions:
  contents: read

jobs:
  tests:
    name: Guardrail tests and scenario tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # No AI, no network: a scripted AI proves the guardrails and the control flow.
      - name: Guardrail tests (offline)
        run: python tests/test_guardrails.py -v

      - name: Report tests (offline)
        run: python tests/test_report.py -v

      # Fake market data and fake history, real AI. A failed scenario exits with code 1, so this step turns red.
      # A push tests the version the daily workflow uses (agent, reviewer off). A manual run can pick another one.
      - name: Scenario tests (fake tools, real AI)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCENARIO_PAUSE: "3"
          MODE: ${{ inputs.mode }}
          REVIEWER: ${{ inputs.reviewer }}
        run: python agent.py --test --mode "${MODE:-agent}" --reviewer "${REVIEWER:-off}"
